name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC: catch toolchain churn (Zig, .NET, ...) without a push
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Byte-compile scripts
        run: python3 -m py_compile scripts/*.py

  # Scaffolds day 1 from each template into a scratch year dir and checks the
  # per-day contract: test passes, run prints the placeholder answers, the
  # bench-mode protocol is followed, and `just bench` writes a valid bench.json.
  validate:
    name: template (${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lang: [rust, go, python, ts, php, csharp, fsharp, zig]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Scratch year repo outside the checkout (runner context is not
      # available in job-level env).
      - name: Set paths
        run: |
          echo "YEAR=$RUNNER_TEMP/year" >> "$GITHUB_ENV"
          echo "DAY=$RUNNER_TEMP/year/days/day-01-${{ matrix.lang }}-v1" >> "$GITHUB_ENV"
          echo "AOC_SCRIPTS=$GITHUB_WORKSPACE/scripts" >> "$GITHUB_ENV"

      - name: Set up toolchains
        uses: ./.github/actions/setup-toolchains
        with:
          lang: ${{ matrix.lang }}

      - name: Scaffold day 1
        run: python3 "$GITHUB_WORKSPACE/scripts/new_day.py" --root "$YEAR" 1 ${{ matrix.lang }}

      - name: Write sample input
        run: printf 'foo\nbar\nbaz\n' > "$DAY/input.txt"

      # `just --justfile` runs recipes with the justfile's directory as cwd.
      - name: Test
        run: just --justfile "$DAY/justfile" test

      - name: Run part 1 and part 2
        run: |
          set -euo pipefail
          p1="$(just --justfile "$DAY/justfile" run 1 2>/dev/null)"
          p2="$(just --justfile "$DAY/justfile" run 2 2>/dev/null)"
          echo "part1=[$p1] part2=[$p2]"
          [ "$p1" = "3" ] || { echo "part 1: expected 3, got '$p1'" >&2; exit 1; }
          [ "$p2" = "9" ] || { echo "part 2: expected 9, got '$p2'" >&2; exit 1; }

      # Drives the executable's bench mode directly and validates the JSON line.
      # $cmd is unquoted on purpose so multi-word commands (`php main.php`) split.
      - name: Harness protocol
        run: |
          set -euo pipefail
          cmd="$(just --justfile "$DAY/justfile" --evaluate solution)"
          just --justfile "$DAY/justfile" build >/dev/null
          (cd "$DAY" && $cmd bench 1 input.txt 5) > "$RUNNER_TEMP/bench1.json"
          (cd "$DAY" && $cmd bench 2 input.txt 3) > "$RUNNER_TEMP/bench2.json"
          # zero iterations is a usage error: non-zero exit, nothing on stdout
          rc=0
          (cd "$DAY" && $cmd bench 1 input.txt 0) > "$RUNNER_TEMP/bench0.out" 2>/dev/null || rc=$?
          [ "$rc" -ne 0 ] || { echo "bench with 0 iterations should fail" >&2; exit 1; }
          [ ! -s "$RUNNER_TEMP/bench0.out" ] || { echo "bench with 0 iterations wrote to stdout" >&2; exit 1; }
          python3 - "$RUNNER_TEMP/bench1.json" "$RUNNER_TEMP/bench2.json" <<'EOF'
          import json, sys

          expected = [(1, 5, "3"), (2, 3, "9")]
          for path, (part, iterations, answer) in zip(sys.argv[1:], expected):
              text = open(path, encoding="utf-8").read()
              lines = [l for l in text.splitlines() if l.strip()]
              assert len(lines) == 1, f"part {part}: expected one JSON line, got {len(lines)}"
              d = json.loads(lines[0])
              assert set(d) == {"schema", "part", "iterations", "ns", "answer", "max_rss_before", "max_rss_after"}, set(d)
              assert d["schema"] == 1 and d["part"] == part and d["iterations"] == iterations and len(d["ns"]) == iterations, d
              assert all(isinstance(n, int) and n >= 0 for n in d["ns"]), d["ns"]
              assert d["answer"] == answer, d["answer"]
              for k in ("max_rss_before", "max_rss_after"):
                  assert d[k] is None or (isinstance(d[k], int) and d[k] > 0), (k, d[k])
              print("protocol ok:", d)
          EOF

      - name: Benchmark
        run: |
          set -euo pipefail
          just --justfile "$DAY/justfile" bench
          test -f "$DAY/bench.json"
          test ! -f "$DAY/bench.md"
          python3 - "$DAY/bench.json" <<'EOF'
          import json, sys

          d = json.load(open(sys.argv[1], encoding="utf-8"))
          assert d["schema"] == 1, d["schema"]
          parts = d["parts"]
          assert [p["part"] for p in parts] == [1, 2], parts
          assert [p["answer"] for p in parts] == ["3", "9"], parts
          for p in parts:
              assert p["wall"] is not None, f"part {p['part']}: no hyperfine wall time"
              assert isinstance(p["rss_delta_bytes"], int), p["rss_delta_bytes"]
              assert set(p["ns"]) >= {"min", "median", "mean", "stddev", "p99", "max"}, p["ns"]
          print("bench.json ok")
          EOF

      - name: Templates stayed clean
        run: |
          status="$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
          if [ -n "$status" ]; then
            echo "scaffolding modified the repo checkout:" >&2
            echo "$status" >&2
            exit 1
          fi
