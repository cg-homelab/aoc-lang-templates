name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC: catch toolchain churn (Zig, .NET, ...) without a push
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Byte-compile scripts
        run: python3 -m py_compile scripts/*.py

  # Scaffolds day 1 from each template into a scratch year dir and checks the
  # per-day contract: test passes, run prints the placeholder answers, the
  # bench-mode protocol is followed, and `just bench` writes a valid bench.json.
  validate:
    name: template (${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lang: [rust, go, python, ts, php, csharp, fsharp, zig, c, c3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Scratch year repo outside the checkout (runner context is not
      # available in job-level env).
      - name: Set paths
        run: |
          echo "YEAR=$RUNNER_TEMP/year" >> "$GITHUB_ENV"
          echo "DAY=$RUNNER_TEMP/year/days/day-01-${{ matrix.lang }}-v1" >> "$GITHUB_ENV"
          echo "AOC_SCRIPTS=$GITHUB_WORKSPACE/scripts" >> "$GITHUB_ENV"

      - name: Set up toolchains
        uses: ./.github/actions/setup-toolchains
        with:
          lang: ${{ matrix.lang }}

      - name: Scaffold day 1
        run: python3 "$GITHUB_WORKSPACE/scripts/new_day.py" --root "$YEAR" 1 ${{ matrix.lang }}

      - name: Write sample input
        run: printf 'foo\nbar\nbaz\n' > "$DAY/input.txt"

      # `just --justfile` runs recipes with the justfile's directory as cwd.
      - name: Test
        run: just --justfile "$DAY/justfile" test

      - name: Run part 1 and part 2
        run: |
          set -euo pipefail
          p1="$(just --justfile "$DAY/justfile" run 1 2>/dev/null)"
          p2="$(just --justfile "$DAY/justfile" run 2 2>/dev/null)"
          echo "part1=[$p1] part2=[$p2]"
          [ "$p1" = "3" ] || { echo "part 1: expected 3, got '$p1'" >&2; exit 1; }
          [ "$p2" = "9" ] || { echo "part 2: expected 9, got '$p2'" >&2; exit 1; }

      # Drives the executable's bench mode directly and validates the sample
      # lines, the `answer <N>` block and the trailing `done` line. The harness
      # parks on one stdin line before exiting, so every run gets stdin.
      # $cmd is unquoted on purpose so multi-word commands (`php main.php`) split.
      - name: Harness protocol
        run: |
          set -euo pipefail
          cmd="$(just --justfile "$DAY/justfile" --evaluate solution)"
          just --justfile "$DAY/justfile" build >/dev/null
          (cd "$DAY" && echo | $cmd bench 1 input.txt 200000000 5 5) > "$RUNNER_TEMP/bench1.out"
          (cd "$DAY" && echo | $cmd bench 2 input.txt 200000000 3 3) > "$RUNNER_TEMP/bench2.out"
          # zero iterations: exit 0 and exactly `done` (the driver's baseline run); EOF releases the park
          (cd "$DAY" && $cmd bench 1 input.txt 0 0 5 </dev/null) > "$RUNNER_TEMP/bench0.out"
          [ "$(cat "$RUNNER_TEMP/bench0.out")" = "done" ] || { echo "bench with 0 iterations should print exactly 'done'" >&2; exit 1; }
          # the harness parks until stdin is released
          start=$(date +%s%N)
          (cd "$DAY" && sleep 1 | $cmd bench 1 input.txt 0 0 5) > "$RUNNER_TEMP/benchpark.out"
          end=$(date +%s%N)
          elapsed_ms=$(( (end - start) / 1000000 ))
          [ "$elapsed_ms" -ge 900 ] || { echo "bench exited after ${elapsed_ms} ms without waiting for stdin" >&2; exit 1; }
          [ "$(cat "$RUNNER_TEMP/benchpark.out")" = "done" ] || { echo "parked bench should print exactly 'done'" >&2; exit 1; }
          # min > max is a usage error: non-zero exit, nothing on stdout, no park
          rc=0
          (cd "$DAY" && $cmd bench 1 input.txt 0 6 5 </dev/null) > "$RUNNER_TEMP/benchbad.out" 2>/dev/null || rc=$?
          [ "$rc" -ne 0 ] || { echo "bench with min-iter > max-iter should fail" >&2; exit 1; }
          [ ! -s "$RUNNER_TEMP/benchbad.out" ] || { echo "bench with min-iter > max-iter wrote to stdout" >&2; exit 1; }
          python3 - "$RUNNER_TEMP/bench1.out" "$RUNNER_TEMP/bench2.out" <<'EOF'
          import sys

          expected = [(1, 5, "3"), (2, 3, "9")]
          for path, (part, n, answer) in zip(sys.argv[1:], expected):
              text = open(path, encoding="utf-8").read()
              lines = text.split("\n")
              assert len(lines) == n + 4 and lines[-1] == "", f"part {part}: unexpected line count {len(lines)}: {text!r}"
              assert all(l.isascii() and l.isdigit() for l in lines[:n]), f"part {part}: bad sample lines: {lines[:n]}"
              assert text == "".join(l + "\n" for l in lines[:n]) + "answer 1\n" + answer + "\n" + "done\n", f"part {part}: {text!r}"
              print("protocol ok:", part, lines[:n], answer)
          EOF

      - name: Benchmark
        run: |
          set -euo pipefail
          just --justfile "$DAY/justfile" bench
          test -f "$DAY/bench.json"
          test ! -f "$DAY/bench.md"
          python3 - "$DAY/bench.json" <<'EOF'
          import json, sys

          d = json.load(open(sys.argv[1], encoding="utf-8"))
          assert d["schema"] == 1, d["schema"]
          parts = d["parts"]
          assert [p["part"] for p in parts] == [1, 2], parts
          assert [p["answer"] for p in parts] == ["3", "9"], parts
          for p in parts:
              assert p["wall"] is not None, f"part {p['part']}: no hyperfine wall time"
              for k in ("rss_baseline_bytes", "rss_peak_bytes", "rss_delta_bytes"):
                  assert isinstance(p[k], int), (k, p[k])
              assert set(p["ns"]) >= {"min", "median", "mean", "stddev", "p99", "max"}, p["ns"]
          print("bench.json ok")
          EOF

      - name: Templates stayed clean
        run: |
          status="$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
          if [ -n "$status" ]; then
            echo "scaffolding modified the repo checkout:" >&2
            echo "$status" >&2
            exit 1
          fi
